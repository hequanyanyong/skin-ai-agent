<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 皮肤病灶初诊系统</title>
    <style>
        /* ==================== 全局样式重置 ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ==================== 根变量定义 ==================== */
        :root {
            --primary-color: #4A90E2;
            --primary-light: #E8F4FD;
            --primary-dark: #357ABD;
            --secondary-color: #5AC8FA;
            --text-primary: #2C3E50;
            --text-secondary: #7F8C8D;
            --text-light: #BDC3C7;
            --bg-primary: #F7FBFD;
            --bg-white: #FFFFFF;
            --border-color: #E1E8ED;
            --success-color: #27AE60;
            --shadow-sm: 0 2px 8px rgba(74, 144, 226, 0.08);
            --shadow-md: 0 4px 16px rgba(74, 144, 226, 0.12);
            --shadow-lg: 0 8px 32px rgba(74, 144, 226, 0.16);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ==================== 基础样式 ==================== */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #E3F2FD 100%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* ==================== 头部样式 ==================== */
        .header {
            background: var(--bg-white);
            padding: 20px 40px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }

        .header-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .header-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* ==================== 主容器布局 ==================== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 40px;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 32px;
            min-height: calc(100vh - 88px);
            align-items: stretch;
        }

        /* ==================== 卡片通用样式 ==================== */
        .card {
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 24px;
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: var(--shadow-lg);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, var(--primary-color), var(--secondary-color));
            border-radius: 2px;
        }

        /* ==================== 左侧输入区 ==================== */
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* 让第一个卡片（上传照片）占据更多空间 */
        .input-section .card:first-child {
            flex: 1.2;
            display: flex;
            flex-direction: column;
        }

        /* 让第二个卡片（症状选择）占据较少空间 */
        .input-section .card:last-child {
            flex: 1;
        }

        /* 图片上传区域 */
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-md);
            padding: 32px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: var(--primary-color);
            background: var(--primary-light);
        }

        .upload-area.dragover {
            border-color: var(--primary-color);
            background: var(--primary-light);
            transform: scale(1.02);
        }

        .upload-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--primary-light), white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .upload-text {
            font-size: 16px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .upload-hint {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .upload-input {
            display: none;
        }

        /* 图片预览 */
        .image-preview {
            margin-top: 20px;
            display: none;
        }

        .image-preview.show {
            display: block;
        }

        .preview-container {
            position: relative;
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .preview-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .preview-remove {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--text-primary);
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .preview-remove:hover {
            background: #E74C3C;
            color: white;
            transform: rotate(90deg);
        }

        /* 症状选择区域 */
        .symptoms-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .symptom-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-primary);
            border: 2px solid transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }

        .symptom-item:hover {
            background: var(--primary-light);
            border-color: var(--primary-color);
        }

        .symptom-item.checked {
            background: var(--primary-light);
            border-color: var(--primary-color);
        }

        .symptom-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .symptom-item.checked .symptom-checkbox {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        .symptom-checkbox::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
            opacity: 0;
            transform: scale(0);
            transition: var(--transition);
        }

        .symptom-item.checked .symptom-checkbox::after {
            opacity: 1;
            transform: scale(1);
        }

        .symptom-label {
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 500;
        }

        /* ==================== 右侧对话区 ==================== */
        .chat-section {
            display: flex;
            flex-direction: column;

        }

        .chat-container {
            height: 450px;
            max-height: 500px;
            background: var(--bg-primary);
            border-radius: var(--radius-md);
            padding: 20px;
            overflow-y: auto;
            overscroll-behavior: contain;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 欢迎消息 */
        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .welcome-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--primary-light), white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .welcome-title {
            font-size: 20px;
            color: var(--text-primary);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .welcome-text {
            font-size: 14px;
            line-height: 1.8;
        }

        /* 消息气泡 */
        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 20px;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        }

        .message.ai .message-avatar {
            background: linear-gradient(135deg, var(--success-color), #2ECC71);
        }

        .message-content {
            max-width: 70%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message.user .message-content {
            align-items: flex-end;
        }

        .message-bubble {
            padding: 14px 18px;
            border-radius: var(--radius-md);
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai .message-bubble {
            background: var(--bg-white);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow-sm);
        }

        .message.ai .message-bubble p {
            margin: 0 0 12px 0;
        }

        .message.ai .message-bubble p:last-child {
            margin-bottom: 0;
        }

        .message.ai .message-bubble strong {
            font-weight: 600;
            color: var(--primary-color);
        }

        .message.ai .message-bubble ul,
        .message.ai .message-bubble ol {
            margin: 8px 0;
            padding-left: 20px;
        }

        .message.ai .message-bubble li {
            margin: 6px 0;
            line-height: 1.5;
        }

        .message.ai .message-bubble h1,
        .message.ai .message-bubble h2,
        .message.ai .message-bubble h3 {
            margin: 12px 0 8px 0;
            font-weight: 600;
            color: var(--text-primary);
        }

        .message.ai .message-bubble h1:first-child,
        .message.ai .message-bubble h2:first-child,
        .message.ai .message-bubble h3:first-child {
            margin-top: 0;
        }

        .message-image {
            max-width: 300px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .message-image img {
            width: 100%;
            display: block;
        }

        .message-time {
            font-size: 12px;
            color: var(--text-light);
        }

        /* Loading 动画 */
        .loading-message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        .loading-bubble {
            padding: 16px 24px;
            background: var(--bg-white);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .loading-dots {
            display: flex;
            gap: 6px;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            background: var(--primary-color);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .loading-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .loading-text {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* 输入区域 */
        .input-area {
            background: var(--bg-white);
            border-radius: var(--radius-md);
            padding: 16px;
            box-shadow: var(--shadow-sm);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .input-field {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-textarea {
            width: 100%;
            min-height: 60px;
            max-height: 120px;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: inherit;
            resize: none;
            transition: var(--transition);
            line-height: 1.5;
        }

        .input-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background: var(--bg-primary);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15),
                        0 0 0 6px rgba(74, 144, 226, 0.05);
        }

        .input-textarea::placeholder {
            color: var(--text-light);
        }

        .input-hint {
            font-size: 12px;
            color: var(--text-light);
            line-height: 1.2;
        }

        .send-button {
            padding: 0 24px;
            height: 60px;
            min-height: 60px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .send-button:active {
            transform: translateY(0);
        }

        .send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ==================== 响应式设计 ==================== */
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
                padding: 20px;
                align-items: flex-start;
            }

            .chat-section {
                height: auto;
            }

            /* 移动端取消左侧卡片拉伸 */
            .input-section .card:first-child,
            .input-section .card:last-child {
                flex: none;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 16px 20px;
            }

            .container {
                padding: 16px;
                gap: 20px;
            }

            .symptoms-grid {
                grid-template-columns: 1fr;
            }

            .message-content {
                max-width: 85%;
            }
        }

        /* ==================== 滚动条美化 ==================== */
        /* 全局滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
            transition: background 0.3s ease;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-light);
        }

        /* 聊天容器专用滚动条 - 更精致优雅 */
        .chat-container::-webkit-scrollbar {
            width: 5px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: rgba(225, 232, 237, 0.3);
            border-radius: 10px;
            margin: 4px 0;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: linear-gradient(
                180deg,
                rgba(74, 144, 226, 0.3) 0%,
                rgba(74, 144, 226, 0.5) 100%
            );
            border-radius: 10px;
            border: 1px solid transparent;
            background-clip: padding-box;
            transition: all 0.3s ease;
        }

        .chat-container::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(
                180deg,
                rgba(74, 144, 226, 0.5) 0%,
                rgba(74, 144, 226, 0.7) 100%
            );
            border: 1px solid transparent;
            background-clip: padding-box;
        }

        /* Firefox 滚动条样式 */
        .chat-container {
            scrollbar-width: thin;
            scrollbar-color: rgba(74, 144, 226, 0.4) rgba(225, 232, 237, 0.3);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <!-- ==================== 页面头部 ==================== -->
    <header class="header">
        <div class="header-icon">🏥</div>
        <div>
            <div class="header-title">AI 皮肤病灶初诊系统</div>
            <div class="header-subtitle">智能识别 · 专业分析 · 温馨提示</div>
        </div>
    </header>

    <!-- ==================== 主容器 ==================== -->
    <div class="container">
        <!-- 左侧：数据输入区 -->
        <div class="input-section">
            <!-- 图片上传卡片 -->
            <div class="card">
                <div class="card-title">上传患处照片</div>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📷</div>
                    <div class="upload-text">点击或拖拽上传图片</div>
                    <div class="upload-hint">支持 JPG、PNG 格式，建议上传清晰照片</div>
                    <input type="file" class="upload-input" id="imageInput" accept="image/*">
                </div>
                <div class="image-preview" id="imagePreview">
                    <div class="preview-container">
                        <img src="" alt="预览图片" class="preview-image" id="previewImg">
                        <button class="preview-remove" id="removeImage">✕</button>
                    </div>
                </div>
            </div>

            <!-- 症状选择卡片 -->
            <div class="card">
                <div class="card-title">选择症状表现</div>
                <div class="symptoms-grid" id="symptomsGrid">
                    <div class="symptom-item" data-symptom="发红">
                        <div class="symptom-checkbox"></div>
                        <div class="symptom-label">发红</div>
                    </div>
                    <div class="symptom-item" data-symptom="瘙痒">
                        <div class="symptom-checkbox"></div>
                        <div class="symptom-label">瘙痒</div>
                    </div>
                    <div class="symptom-item" data-symptom="疼痛">
                        <div class="symptom-checkbox"></div>
                        <div class="symptom-label">疼痛</div>
                    </div>
                    <div class="symptom-item" data-symptom="蜕皮">
                        <div class="symptom-checkbox"></div>
                        <div class="symptom-label">蜕皮</div>
                    </div>
                    <div class="symptom-item" data-symptom="水疱">
                        <div class="symptom-checkbox"></div>
                        <div class="symptom-label">水疱</div>
                    </div>
                    <div class="symptom-item" data-symptom="肿胀">
                        <div class="symptom-checkbox"></div>
                        <div class="symptom-label">肿胀</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧：AI 问诊交互区 -->
        <div class="chat-section">
            <div class="card" style="flex: 1; display: flex; flex-direction: column;">
                <div class="card-title">智能问诊对话</div>
                <div class="chat-container" id="chatContainer">
                    <!-- 欢迎消息 -->
                    <div class="welcome-message" id="welcomeMessage">
                        <div class="welcome-icon">💬</div>
                        <div class="welcome-title">欢迎使用 AI 皮肤病灶初诊系统</div>
                        <div class="welcome-text">
                            请上传患处照片并选择相关症状，<br>
                            我将为您提供专业的初步诊断建议。<br>
                            <span style="color: var(--primary-color); font-weight: 500;">温馨提示：此为 AI 辅助诊断，仅供参考，请以医生诊断为准。</span>
                        </div>
                    </div>
                </div>
                
                <!-- 输入区域 -->
                <div class="input-area">
                    <div class="input-wrapper">
                        <div class="input-field">
                            <textarea 
                                class="input-textarea" 
                                id="messageInput" 
                                placeholder="请输入补充描述或问题..."
                            ></textarea>
                            <div class="input-hint">按 Enter 发送，Shift + Enter 换行</div>
                        </div>
                        <button class="send-button" id="sendButton">
                            <span>发送</span>
                            <span>➤</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== 全局状态管理 ====================
        const state = {
            uploadedImage: null,           // 上传的图片数据
            selectedSymptoms: [],          // 选中的症状列表
            isProcessing: false            // 是否正在处理中
        };

        // 全局变量：存储图片的 Base64 格式
        let selectedImageBase64 = null;

        // ==================== DOM 元素获取 ====================
        const elements = {
            uploadArea: document.getElementById('uploadArea'),
            imageInput: document.getElementById('imageInput'),
            imagePreview: document.getElementById('imagePreview'),
            previewImg: document.getElementById('previewImg'),
            removeImage: document.getElementById('removeImage'),
            symptomsGrid: document.getElementById('symptomsGrid'),
            chatContainer: document.getElementById('chatContainer'),
            welcomeMessage: document.getElementById('welcomeMessage'),
            messageInput: document.getElementById('messageInput'),
            sendButton: document.getElementById('sendButton')
        };

        // ==================== 工具函数 ====================
        
        // 获取当前时间字符串
        function getCurrentTime() {
            const now = new Date();
            return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        }

        // 生成唯一 ID
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        // 获取勾选的症状并拼成字符串
        function getSelectedSymptomsString() {
            // 方法1：从 state.selectedSymptoms 数组获取
            const symptoms = state.selectedSymptoms;
            
            if (symptoms.length === 0) {
                return '';
            }
            
            // 拼成字符串，用顿号分隔
            const symptomsString = symptoms.join('、');
            
            console.log('当前选中的症状:', symptoms);
            console.log('症状字符串:', symptomsString);
            
            return symptomsString;
        }

        // 从 DOM 直接获取勾选的症状（备用方法）
        function getSelectedSymptomsFromDOM() {
            const checkedItems = document.querySelectorAll('.symptom-item.checked');
            const symptoms = [];
            
            checkedItems.forEach(item => {
                const symptom = item.dataset.symptom;
                if (symptom) {
                    symptoms.push(symptom);
                }
            });
            
            return symptoms.join('、');
        }

        // ==================== 图片上传功能 ====================
        
        // 处理图片上传
        function handleImageUpload(file) {
            if (!file || !file.type.startsWith('image/')) {
                alert('请上传有效的图片文件');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                // 保存图片数据到 state
                state.uploadedImage = {
                    data: e.target.result,
                    name: file.name
                };
                
                // 保存 Base64 格式到全局变量
                selectedImageBase64 = e.target.result;
                
                // 显示预览
                elements.previewImg.src = e.target.result;
                elements.imagePreview.classList.add('show');
                
                // 打印日志，方便调试
                console.log('图片已上传，Base64 格式已保存');
                console.log('Base64 数据长度:', selectedImageBase64.length);
            };
            reader.readAsDataURL(file);
        }

        // 点击上传
        elements.uploadArea.addEventListener('click', () => {
            elements.imageInput.click();
        });

        // 文件选择
        elements.imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            handleImageUpload(file);
        });

        // 拖拽上传
        elements.uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            elements.uploadArea.classList.add('dragover');
        });

        elements.uploadArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            elements.uploadArea.classList.remove('dragover');
        });

        elements.uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            elements.uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            handleImageUpload(file);
        });

        // 移除图片
        elements.removeImage.addEventListener('click', (e) => {
            e.stopPropagation();
            state.uploadedImage = null;
            selectedImageBase64 = null;  // 清空全局变量
            elements.imagePreview.classList.remove('show');
            elements.imageInput.value = '';
            console.log('图片已移除，Base64 变量已清空');
        });

        // ==================== 症状选择功能 ====================
        
        elements.symptomsGrid.addEventListener('click', (e) => {
            const symptomItem = e.target.closest('.symptom-item');
            if (!symptomItem) return;

            const symptom = symptomItem.dataset.symptom;
            const isChecked = symptomItem.classList.contains('checked');

            if (isChecked) {
                symptomItem.classList.remove('checked');
                state.selectedSymptoms = state.selectedSymptoms.filter(s => s !== symptom);
            } else {
                symptomItem.classList.add('checked');
                state.selectedSymptoms.push(symptom);
            }
        });

        // ==================== 聊天功能 ====================
        
        // 创建消息元素
        function createMessageElement(content, isUser = false, imageData = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'ai'}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = isUser ? '👤' : '🤖';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            // 添加图片（如果有）
            if (imageData) {
                const imageDiv = document.createElement('div');
                imageDiv.className = 'message-image';
                const img = document.createElement('img');
                img.src = imageData;
                imageDiv.appendChild(img);
                contentDiv.appendChild(imageDiv);
            }

            // 添加文本内容
            if (content) {
                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                if (isUser) {
                    bubble.textContent = content;
                } else {
                    bubble.innerHTML = marked.parse(content);
                }
                contentDiv.appendChild(bubble);
            }

            // 添加时间
            const time = document.createElement('div');
            time.className = 'message-time';
            time.textContent = getCurrentTime();
            contentDiv.appendChild(time);

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);

            return messageDiv;
        }

        // 创建 Loading 元素
        function createLoadingElement() {
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading-message';
            loadingDiv.id = 'loadingMessage';

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.style.background = 'linear-gradient(135deg, #27AE60, #2ECC71)';
            avatar.textContent = '🤖';

            const bubble = document.createElement('div');
            bubble.className = 'loading-bubble';

            const dots = document.createElement('div');
            dots.className = 'loading-dots';
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('div');
                dot.className = 'loading-dot';
                dots.appendChild(dot);
            }

            const text = document.createElement('div');
            text.className = 'loading-text';
            text.textContent = 'AI 正在思考诊断中...';

            bubble.appendChild(dots);
            bubble.appendChild(text);

            loadingDiv.appendChild(avatar);
            loadingDiv.appendChild(bubble);

            return loadingDiv;
        }

        // 移除欢迎消息
        function removeWelcomeMessage() {
            if (elements.welcomeMessage) {
                elements.welcomeMessage.remove();
                elements.welcomeMessage = null;
            }
        }

        // 滚动到底部
        function scrollToBottom() {
            elements.chatContainer.scrollTop = elements.chatContainer.scrollHeight;
        }

        //  AI 回复
        async function simulateAIResponse(userMessage, hasImage, symptoms, imageBase64Data) {
            // 1. 移除欢迎消息并添加 Loading
            removeWelcomeMessage();
            const loadingElement = createLoadingElement();
            elements.chatContainer.appendChild(loadingElement);
            scrollToBottom();

            // 2. 智谱 API 配置 (请替换为你的真实 Key)
            const API_KEY = "9be309508b9c4d56bc0f56096c8ab19b.eroSF27fwmiMww20"; 
            const API_URL = "https://open.bigmodel.cn/api/paas/v4/chat/completions";

            // 3. 构造发送给 AI 的 Prompt（融入合规避敏与格式引导）
            const isHealthConsultation = hasImage || symptoms.length > 0 || 
                (userMessage && (
                    userMessage.includes('症状') || 
                    userMessage.includes('疼痛') || 
                    userMessage.includes('瘙痒') || 
                    userMessage.includes('发红') || 
                    userMessage.includes('起疹') || 
                    userMessage.includes('脱皮') || 
                    userMessage.includes('水泡') || 
                    userMessage.includes('皮肤') ||
                    userMessage.includes('患处') ||
                    userMessage.includes('病情')
                ));

            let promptText = "";
            
            if (isHealthConsultation) {
                promptText = `你是一个专业的皮肤图像特征分析助手。\n\n` +
                             `【体征表现】: ${symptoms.length > 0 ? symptoms.join('、') : '未勾选'}\n` +
                             `【补充描述】: ${userMessage || '无'}\n\n` +
                             `【分析指示】：\n` +
                             `1. 仔细观察图片：分析患处的形态特征（如是否有晶莹水疱、露珠状改变、基底发红或红斑分布等）。\n` +
                             `2. 结合图片细节与体征，分析 2-3 种最贴合的常见可能原因（如看到水疱特征请优先分析水痘、带状疱疹或疱疹样皮炎等）。\n` +
                             `3. 给出建议就诊科室（如皮肤科）。\n` +
                             `4. 提供 2-3 条日常护理建议（如保持干燥、严禁挤压或破溃）。\n\n` +
                             `注意：回答需专业客观`;
            } else {
                promptText = `用户说："${userMessage}"\n\n` +
                             `请以温和、自然的 AI 皮肤健康助手语气简短回答（不超过 50 字），引导用户上传照片或描述症状。`;
            }

            // 4. 组装多模态节点 (Text + Image)
            const contentList = [{ type: "text", text: promptText }];
            if (hasImage && imageBase64Data) {
                contentList.push({
                    type: "image_url",
                    image_url: { url: imageBase64Data }
                });
            }

            try {
                // 5. 调用智谱 GLM-4V 大模型 API
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "glm-4v-flash", // 智谱免费/低门槛多模态模型
                        messages: [
                            { role: "user", content: contentList }
                        ]
                    })
                });

                const data = await response.json();

                // 移除 Loading
                const loadingMsg = document.getElementById('loadingMessage');
                if (loadingMsg) loadingMsg.remove();

                let aiResponse = "";

                if (data.choices && data.choices[0]) {
                    // 获取 API 真实回答并拼上你的通用免责声明
                    aiResponse = data.choices[0].message.content + "\n\n⚠️ 温馨提示：此分析仅供健康科普与导诊参考，请以专业医生诊断为准。";
                } else {
                    throw new Error("API 返回异常");
                }

                // 添加 AI 真实回复到页面
                const aiMessageElement = createMessageElement(aiResponse, false);
                elements.chatContainer.appendChild(aiMessageElement);

            } catch (error) {
                console.error("API 请求失败，回退到兜底逻辑:", error);

                // 移除 Loading
                const loadingMsg = document.getElementById('loadingMessage');
                if (loadingMsg) loadingMsg.remove();

                // 6. 出错或 Key 未配置时的兜底逻辑 (保留你原有的降级逻辑)
                let fallbackResponse = "";
                if (hasImage && symptoms.length > 0) {
                    fallbackResponse = `已接收到照片和【${symptoms.join('、')}】症状。当前网络或接口响应超时，建议保持患处清洁干燥，避免搔抓，并及时就医检查。`;
                } else if (hasImage) {
                    fallbackResponse = `已收到照片。建议补充勾选相关症状（如发红、瘙痒等），方便进行更全面的分析。`;
                } else if (symptoms.length > 0) {
                    fallbackResponse = `您选择的症状：${symptoms.join('、')}。建议上传患处照片以获取更精准的科普分析。`;
                } else {
                    fallbackResponse = `您好！我是 AI 皮肤健康分诊助手。请上传照片或勾选症状，我将为您提供初步的健康导诊建议。`;
                }
                
                fallbackResponse += "\n\n⚠️ 温馨提示：此为 AI 辅助分析，仅供参考，请以专业医生诊断为准。";

                const aiMessageElement = createMessageElement(fallbackResponse, false);
                elements.chatContainer.appendChild(aiMessageElement);
            } finally {
                // 恢复发送状态
                state.isProcessing = false;
                elements.sendButton.disabled = false;
                scrollToBottom();
            }
        }

        // 发送消息
        function sendMessage() {
            const messageText = elements.messageInput.value.trim();
            const hasImage = state.uploadedImage !== null;
            const hasSymptoms = state.selectedSymptoms.length > 0;

            // 验证是否有内容
            if (!messageText && !hasImage && !hasSymptoms) {
                alert('请输入描述、上传图片或选择症状后再发送');
                return;
            }

            if (state.isProcessing) return;

            state.isProcessing = true;
            elements.sendButton.disabled = true;

            // 移除欢迎消息
            removeWelcomeMessage();

            // 构建用户消息
            let userMessage = messageText;
            if (hasSymptoms) {
                const symptomText = `症状：${state.selectedSymptoms.join('、')}`;
                userMessage = userMessage ? `${symptomText}。${userMessage}` : symptomText;
            }

            // 添加用户消息到聊天框
            const userMessageElement = createMessageElement(
                userMessage,
                true,
                hasImage ? state.uploadedImage.data : null
            );
            elements.chatContainer.appendChild(userMessageElement);
            scrollToBottom();

            // 清空输入
            elements.messageInput.value = '';
            
            // 清空图片（已发送）
            const sentImageData = state.uploadedImage ? state.uploadedImage.data : null;
            state.uploadedImage = null;
            elements.imagePreview.classList.remove('show');
            elements.imageInput.value = '';

            // 保存选中的症状（用于 AI 分析）
            const selectedSymptomsCopy = [...state.selectedSymptoms];

            // 1. 重置 JS 中的选中状态
            state.selectedSymptoms = [];

            // 2. 清除页面上所有标签的 .checked 高亮和打勾样式
            document.querySelectorAll('.symptom-item.checked').forEach(item => {
                item.classList.remove('checked');
            });

            // 模拟 AI 回复

            simulateAIResponse(userMessage, hasImage, selectedSymptomsCopy, sentImageData);
        }

        // 点击发送按钮
        elements.sendButton.addEventListener('click', sendMessage);

        // 键盘事件
        elements.messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 自动调整文本框高度
        elements.messageInput.addEventListener('input', (e) => {
            e.target.style.height = 'auto';
            e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
        });
    </script>
</body>
</html>
